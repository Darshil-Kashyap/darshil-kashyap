<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Children's Book Sharing</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .book { border: 1px solid #ddd; padding: 10px; margin: 10px 0; }
        .comment { margin-left: 20px; }
    </style>
</head>
<body>
    <h1>Children's Book Sharing</h1>

    <h2>Post a Book</h2>
    <form id="bookForm">
        <input type="text" id="title" placeholder="Book Title" required>
        <input type="text" id="author" placeholder="Author" required>
        <textarea id="summary" placeholder="Summary" required></textarea>
        <button type="submit">Post Book</button>
    </form>

    <div id="bookList">
        <h2>Books</h2>
    </div>

    <script>
        document.getElementById('bookForm').addEventListener('submit', function(event) {
            event.preventDefault();
            let title = document.getElementById('title').value;
            let author = document.getElementById('author').value;
            let summary = document.getElementById('summary').value;

            let bookDiv = document.createElement('div');
            bookDiv.classList.add('book');
            bookDiv.innerHTML = `<h3>${title}</h3><p><strong>Author:</strong> ${author}</p><p>${summary}</p>
            <h4>Comments:</h4>
            <div class="comments"></div>
            <input type="text" class="commentInput" placeholder="Add a comment">
            <button onclick="addComment(this)">Comment</button>`;

            document.getElementById('bookList').appendChild(bookDiv);

            document.getElementById('title').value = '';
            document.getElementById('author').value = '';
            document.getElementById('summary').value = '';
        });

        function addComment(button) {
            let commentInput = button.previousElementSibling;
            let commentText = commentInput.value;
            if (commentText.trim() !== '') {
                let commentDiv = document.createElement('p');
                commentDiv.classList.add('comment');
                commentDiv.textContent = commentText;
                button.parentElement.querySelector('.comments').appendChild(commentDiv);
                commentInput.value = '';
            }
        }
    </script>
</body>
</html>
